# Keeps the free Supabase project from pausing (free projects pause after
# 1 week without activity). Once a day it makes one tiny read through the
# Supabase REST API, which counts as activity. No app code involved.
#
# Setup (GitHub -> Settings -> Secrets and variables -> Actions):
#   SUPABASE_URL              e.g. https://<project-ref>.supabase.co
#   SUPABASE_PUBLISHABLE_KEY  the public (publishable) key - never the service role key
#
# Scheduled workflows only run from the default branch (main), and GitHub
# disables them after 60 days without repository activity - re-enable from
# the Actions tab if that happens.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 3 * * *" # daily, 03:17 UTC
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Set the SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY repository secrets."
            exit 1
          fi
          # RLS returns [] for the public key; the query still runs in the database.
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" \
            "$SUPABASE_URL/rest/v1/roles?select=id&limit=1")
          echo "Supabase responded $status"
          test "$status" = "200"
